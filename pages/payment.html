<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <link rel="stylesheet" href="../css/payment.css">
</head>

<body>

    <header class="payment-header">
        <h1>Payment</h1>
    </header>

    <main class="payment-container">

        <!-- Booking Summary -->
        <section class="booking-summary">

            <h2>Booking Summary</h2>

            <div id="bookingDetails">
                <!-- Booking details will be loaded using JavaScript -->
            </div>

        </section>


        <!-- Payment Section -->
        <section class="payment-section">

            <h2>Payment Details</h2>

            <form id="paymentForm">

                <!-- Payment Method -->
                <div class="form-group">

                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select id="paymentMethod" required>

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="card">
                            Credit / Debit Card
                        </option>

                        <option value="upi">
                            UPI
                        </option>

                        <option value="netbanking">
                            Net Banking
                        </option>

                    </select>

                </div>


                <!-- Card Details -->
                <div id="cardDetails" class="payment-method-details">

                    <div class="form-group">

                        <label for="cardNumber">
                            Card Number
                        </label>

                        <input
                            type="text"
                            id="cardNumber"
                            placeholder="Enter card number"
                            maxlength="16"
                        >

                    </div>


                    <div class="card-row">

                        <div class="form-group">

                            <label for="expiryDate">
                                Expiry Date
                            </label>

                            <input
                                type="text"
                                id="expiryDate"
                                placeholder="MM/YY"
                                maxlength="5"
                            >

                        </div>


                        <div class="form-group">

                            <label for="cvv">
                                CVV
                            </label>

                            <input
                                type="password"
                                id="cvv"
                                placeholder="CVV"
                                maxlength="3"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="cardName">
                            Card Holder Name
                        </label>

                        <input
                            type="text"
                            id="cardName"
                            placeholder="Enter card holder name"
                        >

                    </div>

                </div>


                <!-- UPI Details -->
                <div id="upiDetails" class="payment-method-details">

                    <div class="form-group">

                        <label for="upiId">
                            UPI ID
                        </label>

                        <input
                            type="text"
                            id="upiId"
                            placeholder="example@upi"
                        >

                    </div>

                </div>


                <!-- Net Banking Details -->
                <div
                    id="netBankingDetails"
                    class="payment-method-details"
                >

                    <div class="form-group">

                        <label for="bank">
                            Select Bank
                        </label>

                        <select id="bank">

                            <option value="">
                                Select Bank
                            </option>

                            <option value="sbi">
                                State Bank of India
                            </option>

                            <option value="hdfc">
                                HDFC Bank
                            </option>

                            <option value="icici">
                                ICICI Bank
                            </option>

                            <option value="axis">
                                Axis Bank
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Error Message -->
                <p
                    id="paymentError"
                    class="payment-error"
                ></p>


                <!-- Total -->
                <div class="payment-total">

                    <span>Total Amount</span>

                    <strong id="totalAmount">
                        ₹0
                    </strong>

                </div>


                <!-- Pay Button -->
                <button
                    type="submit"
                    id="payButton"
                >
                    Pay Now
                </button>


                <!-- Back Button -->
                <button
                    type="button"
                    id="backButton"
                    class="back-button"
                >
                    Back
                </button>

            </form>

        </section>

    </main>


    <script src="../js/payment.js"></script>

</body>
</html>
