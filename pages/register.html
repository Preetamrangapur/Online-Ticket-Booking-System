<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Ticket Booking - Registration</title>

    <!-- =========================
         CSS - Registration Design
         ========================= -->
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .registration-container h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .registration-container .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #333;
        }

        .error {
            color: #d00000;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .register-button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            display: none;
        }

        .success {
            color: green;
        }

        .general-error {
            color: #d00000;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        /* Test result section */
        .test-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .test-section h3 {
            margin-bottom: 10px;
        }

        .test-result {
            font-size: 13px;
            margin: 5px 0;
        }

    </style>
</head>

<body>

    <!-- =========================
         Registration Interface
         ========================= -->

    <div class="registration-container">

        <h1>Create Account</h1>

        <p class="description">
            Register to use the Online Ticket Booking System
        </p>

        <form id="registrationForm">

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >

                <p id="fullNameError" class="error"></p>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <p id="emailError" class="error"></p>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10 digit phone number"
                    maxlength="10"
                >

                <p id="phoneError" class="error"></p>
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Create a username"
                >

                <p id="usernameError" class="error"></p>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >

                <p id="passwordError" class="error"></p>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

                <p id="confirmPasswordError" class="error"></p>
            </div>

            <!-- Register Button -->
            <button
                type="submit"
                class="register-button"
            >
                Register
            </button>

        </form>

        <!-- Success / Error Message -->
        <p id="message"></p>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account?
            <a href="#">Login</a>
        </div>

        <!-- =========================
             Registration Test Section
             ========================= -->

        <div class="test-section">

            <h3>Registration Validation Tests</h3>

            <p id="test1" class="test-result">
                Test 1: Required field validation
            </p>

            <p id="test2" class="test-result">
                Test 2: Email validation
            </p>

            <p id="test3" class="test-result">
                Test 3: Phone validation
            </p>

            <p id="test4" class="test-result">
                Test 4: Password validation
            </p>

            <p id="test5" class="test-result">
                Test 5: Duplicate user validation
            </p>

        </div>

    </div>


    <!-- =========================
         JavaScript
         Registration Functionality
         ========================= -->

    <script>

        const form = document.getElementById("registrationForm");

        const message = document.getElementById("message");


        /*
         * Display validation error
         */
        function showError(elementId, messageText) {

            const element = document.getElementById(elementId);

            element.textContent = messageText;
            element.style.display = "block";
        }


        /*
         * Clear validation error
         */
        function clearError(elementId) {

            const element = document.getElementById(elementId);

            element.textContent = "";
            element.style.display = "none";
        }


        /*
         * Clear all validation errors
         */
        function clearErrors() {

            clearError("fullNameError");
            clearError("emailError");
            clearError("phoneError");
            clearError("usernameError");
            clearError("passwordError");
            clearError("confirmPasswordError");

            message.style.display = "none";
        }


        /*
         * Registration Form
         */
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            clearErrors();

            /*
             * Get form values
             */
            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            let isValid = true;


            /*
             * 1. Required Field Validation
             */
            if (fullName === "") {

                showError(
                    "fullNameError",
                    "Full name is required."
                );

                isValid = false;
            }


            if (email === "") {

                showError(
                    "emailError",
                    "Email is required."
                );

                isValid = false;
            }


            if (phone === "") {

                showError(
                    "phoneError",
                    "Phone number is required."
                );

                isValid = false;
            }


            if (username === "") {

                showError(
                    "usernameError",
                    "Username is required."
                );

                isValid = false;
            }


            if (password === "") {

                showError(
                    "passwordError",
                    "Password is required."
                );

                isValid = false;
            }


            if (confirmPassword === "") {

                showError(
                    "confirmPasswordError",
                    "Please confirm your password."
                );

                isValid = false;
            }


            if (!isValid) {

                message.textContent =
                    "Please fill in all required fields.";

                message.className = "general-error";
                message.style.display = "block";

                return;
            }


            /*
             * 2. Email Validation
             */
            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {

                showError(
                    "emailError",
                    "Please enter a valid email address."
                );

                isValid = false;
            }


            /*
             * 3. Phone Number Validation
             */
            const phonePattern =
                /^[0-9]{10}$/;

            if (!phonePattern.test(phone)) {

                showError(
                    "phoneError",
                    "Phone number must contain exactly 10 digits."
                );

                isValid = false;
            }


            /*
             * 4. Username Validation
             */
            if (username.length < 4) {

                showError(
                    "usernameError",
                    "Username must contain at least 4 characters."
                );

                isValid = false;
            }


            /*
             * 5. Password Validation
             */
            if (password.length < 6) {

                showError(
                    "passwordError",
                    "Password must contain at least 6 characters."
                );

                isValid = false;
            }


            /*
             * 6. Confirm Password Validation
             */
            if (password !== confirmPassword) {

                showError(
                    "confirmPasswordError",
                    "Passwords do not match."
                );

                isValid = false;
            }


            if (!isValid) {

                message.textContent =
                    "Please correct the errors and try again.";

                message.className = "general-error";
                message.style.display = "block";

                return;
            }


            /*
             * Get previously registered users.
             * This is used for basic duplicate checking
             * in this simple frontend implementation.
             */
            const users =
                JSON.parse(localStorage.getItem("users")) || [];


            /*
             * 7. Check Existing Email / Username
             */
            const existingUser = users.find(function(user) {

                return user.email.toLowerCase() ===
                           email.toLowerCase()
                       ||
                       user.username.toLowerCase() ===
                           username.toLowerCase();

            });


            if (existingUser) {

                if (
                    existingUser.email.toLowerCase() ===
                    email.toLowerCase()
                ) {

                    showError(
                        "emailError",
                        "This email is already registered."
                    );

                }

                if (
                    existingUser.username.toLowerCase() ===
                    username.toLowerCase()
                ) {

                    showError(
                        "usernameError",
                        "This username is already taken."
                    );

                }

                message.textContent =
                    "Registration failed. User already exists.";

                message.className = "general-error";
                message.style.display = "block";

                return;
            }


            /*
             * 8. Create New User
             */
            const newUser = {

                fullName: fullName,
                email: email,
                phone: phone,
                username: username,

                /*
                 * This is only a frontend demonstration.
                 * Real applications must never store passwords
                 * directly in localStorage.
                 */
                password: password

            };


            /*
             * 9. Save User
             */
            users.push(newUser);

            localStorage.setItem(
                "users",
                JSON.stringify(users)
            );


            /*
             * 10. Registration Success
             */
            message.textContent =
                "Registration successful! Your account has been created.";

            message.className = "success";
            message.style.display = "block";


            /*
             * Clear form after successful registration
             */
            form.reset();

        });


        /*
         * ==========================
         * Basic Registration Tests
         * ==========================
         *
         * These tests demonstrate that
         * the validation functions are working.
         */


        function runRegistrationTests() {

            let test1 = true;
            let test2 = true;
            let test3 = true;
            let test4 = true;
            let test5 = true;


            /*
             * Test 1:
             * Required field validation
             */
            if (
                "".trim() === "" &&
                "".trim() === ""
            ) {

                test1 = true;

            } else {

                test1 = false;
            }


            /*
             * Test 2:
             * Email validation
             */
            const validEmail =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            test2 =
                validEmail.test("test@example.com") &&
                !validEmail.test("invalid-email");


            /*
             * Test 3:
             * Phone validation
             */
            const validPhone =
                /^[0-9]{10}$/;

            test3 =
                validPhone.test("9876543210") &&
                !validPhone.test("12345");


            /*
             * Test 4:
             * Password validation
             */
            test4 =
                "password123".length >= 6 &&
                "123".length < 6;


            /*
             * Test 5:
             * Duplicate user validation
             */
            const testUsers = [
                {
                    email: "existing@example.com",
                    username: "existinguser"
                }
            ];

            const duplicate =
                testUsers.find(function(user) {

                    return user.email ===
                               "existing@example.com"
                           ||
                           user.username ===
                               "existinguser";

                });

            test5 = duplicate !== undefined;


            /*
             * Display test results
             */
            document.getElementById("test1").textContent =
                "Test 1: Required field validation - " +
                (test1 ? "PASSED" : "FAILED");

            document.getElementById("test2").textContent =
                "Test 2: Email validation - " +
                (test2 ? "PASSED" : "FAILED");

            document.getElementById("test3").textContent =
                "Test 3: Phone validation - " +
                (test3 ? "PASSED" : "FAILED");

            document.getElementById("test4").textContent =
                "Test 4: Password validation - " +
                (test4 ? "PASSED" : "FAILED");

            document.getElementById("test5").textContent =
                "Test 5: Duplicate user validation - " +
                (test5 ? "PASSED" : "FAILED");

        }


        /*
         * Run tests when page loads
         */
        runRegistrationTests();

    </script>

</body>
</html>
